let audioCtx = null;
function getCtx() {
  if (audioCtx) return audioCtx;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  audioCtx = new Ctor();
  return audioCtx;
}

function playKeySound(profileKey, category, muted, panHint, volume) {
  if (volume === undefined) volume = 1;
  if (panHint === undefined) panHint = 0;
  if (volume <= 0) return;
  const profile = SOUND_PROFILES[profileKey] || SOUND_PROFILES.soft;
  const spec = profile[category] || profile.normal;
  if (!spec.gain) return;
  const ctx = getCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume();
  const now = ctx.currentTime;

  const osc = ctx.createOscillator();
  osc.type = spec.type;
  osc.frequency.setValueAtTime(spec.freq * (0.96 + Math.random() * 0.08), now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, spec.freq * 0.6), now + spec.decay);

  const noise = ctx.createBufferSource();
  const noiseBuf = ctx.createBuffer(1, Math.max(1, ctx.sampleRate * 0.02), ctx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  noise.buffer = noiseBuf;

  const gain = ctx.createGain();
  const baseGain = (muted ? spec.gain * 0.7 : spec.gain) * (0.9 + Math.random() * 0.15) * volume;
  gain.gain.setValueAtTime(baseGain, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + spec.decay);

  const mixer = ctx.createGain();
  osc.connect(mixer);
  noise.connect(mixer);
  mixer.connect(gain);

  if (typeof ctx.createStereoPanner === "function") {
    const panner = ctx.createStereoPanner();
    panner.pan.value = Math.max(-1, Math.min(1, panHint + (Math.random() - 0.5) * 0.08));
    gain.connect(panner);
    panner.connect(ctx.destination);
  } else {
    gain.connect(ctx.destination);
  }

  osc.start(now);
  noise.start(now);
  osc.stop(now + spec.decay + 0.02);
  noise.stop(now + 0.02);
}

/* ============================== HELPERS ============================== */

function computeKeyPan(rows, rowUnits) {
  const pans = {};
  for (const row of rows) {
    let cursor = 0;
    for (const key of row) {
      if (!key) { cursor += 1; continue; }
      const width = key.width || 1;
      const center = cursor + width / 2;
      pans[key.id] = ((center / rowUnits) * 2 - 1) * 0.3;
      cursor += width;
    }
  }
  return pans;
}

function shiftLightness(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
  const adj = amount * 2.2;
  return `rgb(${clamp(r + adj)}, ${clamp(g + adj)}, ${clamp(b + adj)})`;
}

function hashKeyId(id) {
  let h = 2166136261;
  for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967295;
}

function getKeyVariance(id, small) {
  const a = hashKeyId(id), b = hashKeyId(id + "_b"), c = hashKeyId(id + "_c"),
        d = hashKeyId(id + "_d"), e = hashKeyId(id + "_e");
  return {
    hueShift: (a - 0.5) * 3,
    lightnessShift: (b - 0.5) * 4,
    specularShiftX: (c - 0.5) * 16,
    specularShiftY: (a * c - 0.5) * 12,
    wearAmount: small ? 0.08 + c * 0.06 : 0.1 + d * 0.1,
    microTilt: (e - 0.5) * 0.32,
    rimBias: 0.85 + e * 0.25,
  };
}

/* ============================== TIERS ============================== */

const MOBILE_BREAKPOINT = "(max-width: 639px)";
const TABLET_BREAKPOINT = "(max-width: 1023px)";

function resolveTier() {
  if (typeof window === "undefined") return "desktop";
  if (window.matchMedia(MOBILE_BREAKPOINT).matches) return "mobile";
  if (window.matchMedia(TABLET_BREAKPOINT).matches) return "tablet";
  return "desktop";
}

function useDeviceTier() {
  const [tier, setTier] = useState(resolveTier);
  useEffect(() => {
    const mq = window.matchMedia(MOBILE_BREAKPOINT);
    const tq = window.matchMedia(TABLET_BREAKPOINT);
    const update = () => setTier(resolveTier());
    update();
    mq.addEventListener("change", update);
    tq.addEventListener("change", update);
    return () => { mq.removeEventListener("change", update); tq.removeEventListener("change", update); };
  }, []);
  return tier;
}

const MIN_VISIBLE_PRESS_MS = 55;

function usePressState() {
  const [pressed, setPressed] = useState(false);
  const pressedAtRef = useRef(0);
  const releaseTimeoutRef = useRef(null);
  const clearPendingRelease = useCallback(() => {
    if (releaseTimeoutRef.current !== null) { window.clearTimeout(releaseTimeoutRef.current); releaseTimeoutRef.current = null; }
  }, []);
  const press = useCallback(() => { clearPendingRelease(); pressedAtRef.current = performance.now(); setPressed(true); }, [clearPendingRelease]);
  const release = useCallback(() => {
    const elapsed = performance.now() - pressedAtRef.current;
    const remaining = MIN_VISIBLE_PRESS_MS - elapsed;
    if (remaining > 0) {
      clearPendingRelease();
      releaseTimeoutRef.current = window.setTimeout(() => { releaseTimeoutRef.current = null; setPressed(false); }, remaining);
    } else setPressed(false);
  }, [clearPendingRelease]);
  useEffect(() => clearPendingRelease, [clearPendingRelease]);
  return [pressed, press, release];
}

const Key = memo(function Key({ config, rowIndex, tier, theme: themeProp, registerTrigger, onActivate, onDeactivate }) {

  const theme = useMemo(() => {
    if (!themeProp.multiColor) return themeProp;
    const c = getPrismKeyColors(id);

  }, [themeProp, id]);
  const w = width || 1;
  const al = align || "center";
  const [pointerPressed, pressPointer, releasePointer] = usePressState();
  const [physicallyPressed, pressPhysical, releasePhysical] = usePressState();
  const sculptRows = ROW_SCULPT_TIERS[tier];

  const primaryAlign = al;

  useEffect(() => registerTrigger(id, { press: pressPhysical, release: releasePhysical }), [id, registerTrigger, pressPhysical, releasePhysical]);

  const wallBase = theme.darkKeys

      topGradient: `radial-gradient(115% 125% at ${23 + variance.specularShiftX * 0.4}% 9%, rgba(255,255,255,${(theme.darkKeys ? 0.14 : 0.4) - variance.wearAmount * 0.06}), rgba(255,255,255,0) 44%), radial-gradient(150% 120% at 50% 118%, rgba(0,0,0,${0.07 + variance.wearAmount * 0.02}), transparent 60%), ${shiftLightness(theme.keycapBase, variance.lightnessShift * 0.6)}`,
      topFilter: `hue-rotate(${variance.hueShift * 0.4}deg)`,
      topNoisePosition: `${variance.specularShiftY}px ${variance.specularShiftX}px`,
      topShadow: `inset 0 0 0 0.75px rgba(${theme.darkKeys ? "0,0,0,0.4" : "96,70,42,0.28"}), inset 0 0.6px 0 rgba(255,250,238,${theme.darkKeys ? 0.08 : 0.4}), inset 0 -0.8px 1.2px rgba(15,9,4,0.04)`,
      topShadowPressed: `inset 0 0 0 0.75px rgba(${theme.darkKeys ? "0,0,0,0.5" : "96,70,42,0.34"}), inset 0 0.5px 0 rgba(255,250,238,${theme.darkKeys ? 0.05 : 0.22}), inset 0 1px 2px rgba(15,10,5,0.1)`,
      rimOpacityUp: (theme.darkKeys ? 0.25 : 0.55) * variance.rimBias,
      rimOpacityDown: (theme.darkKeys ? 0.1 : 0.22) * variance.rimBias,
    };
  }, [sculpt, variance, theme]);

  const handlePress = useCallback((event) => {
    event.currentTarget.setPointerCapture(event.pointerId);
    pressPointer();
    onActivate(id);
  }, [id, pressPointer, onActivate]);

  const handleRelease = useCallback(() => { releasePointer(); onDeactivate(id); }, [releasePointer, onDeactivate, id]);

  return (
    <button
      type="button"

      data-pressed={pressed}

    >
      <span className="pointer-events-none absolute" style={{ inset: 0, borderRadius: radius.wall, boxShadow: pressed ? "0 0.5px 1px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2)" : contactShadow, transition: "box-shadow 140ms ease-out", zIndex: 0 }} />
      <span className="absolute inset-0" style={{ borderRadius: radius.wall, background: layers.wallGradient, filter: layers.wallFilter, boxShadow: layers.wallShadow, zIndex: 1 }} />
      <span className="pointer-events-none absolute inset-0 mix-blend-overlay" style={{ borderRadius: radius.wall, backgroundImage: `url("${PBT_NOISE_URI}")`, backgroundSize: `${noiseSize.wall}px ${noiseSize.wall}px`, backgroundPosition: layers.wallNoisePosition, opacity: noiseOpacity.wall, zIndex: 1 }} />
      <span className="absolute" style={{ borderRadius: radius.top, inset: layers.insetTRBL, background: layers.topGradient, filter: layers.topFilter, boxShadow: pressed ? layers.topShadowPressed : layers.topShadow, transition: "box-shadow 140ms ease-out, background 140ms ease-out", zIndex: 3 }} />
      <span className="pointer-events-none absolute mix-blend-overlay" style={{ borderRadius: radius.top, inset: layers.insetTRBL, backgroundImage: `url("${PBT_NOISE_URI}")`, backgroundSize: `${noiseSize.top}px ${noiseSize.top}px`, backgroundPosition: layers.topNoisePosition, opacity: noiseOpacity.top, zIndex: 3 }} />
      <span className="pointer-events-none absolute" style={{ borderRadius: radius.top, inset: layers.insetTRBL, background: `radial-gradient(55% 50% at 26% 18%, rgba(255,252,244,${theme.darkKeys ? 0.12 : 0.28}), transparent 70%)`, opacity: pressed ? 0.4 : 1, transition: "opacity 140ms ease-out", zIndex: 4 }} />
      <span className="pointer-events-none absolute" style={{ borderRadius: radius.top, inset: layers.insetTRBL, background: `linear-gradient(180deg, rgba(255,255,255,${theme.darkKeys ? 0.1 : 0.24}) 0%, transparent 14%), linear-gradient(100deg, rgba(255,255,255,${theme.darkKeys ? 0.04 : 0.09}) 0%, transparent 9%)`, opacity: pressed ? layers.rimOpacityDown : layers.rimOpacityUp, transition: "opacity 140ms ease-out", zIndex: 4 }} />

        {shiftLabel && (
          <span className="absolute font-medium leading-none" style={{ top: `calc(${sculpt.insetTop}px + ${LEGEND_SHARED.shiftTopOffset})`, left: LEGEND_SHARED.shiftLeftOffset, fontSize: legendFont.shift, color: theme.legendInkSoft, opacity: LEGEND_SHARED.shiftOpacity, letterSpacing: "0.01em" }}>{shiftLabel}</span>
        )}
        {label && (
          <span className={`absolute leading-none ${small ? "font-semibold" : "font-bold"} ${primaryAlign === "left" ? "text-left" : "text-center"}`} style={{
            bottom: `calc(${sculpt.insetBottom}px + ${LEGEND_SHARED.primaryBottomOffset})`,
            left: primaryAlign === "left" ? LEGEND_SHARED.primaryLeftOffset : (shiftLabel ? `calc(50% - ${LEGEND_SHARED.opticalCenterShift})` : "50%"),

/* ============================== KEYBOARD BODY ============================== */

const MODIFIER_FAMILIES = [
  { modifier: "Alt", ids: ["lalt", "ralt"] },
  { modifier: "Control", ids: ["lctrl"] },
  { modifier: "Shift", ids: ["lshift", "rshift"] },
  { modifier: "Meta", ids: ["lwin", "rwin"] },
];

function VintageKeyboard({ layout, themeKey, soundKey, volume, typingMode, onType, lighting = "off" }) {
  const theme = THEMES[themeKey];
  const alphaRows = useMemo(() => buildLayoutRows(layout), [layout]);
  const meta = LAYOUT_META[layout];
  const keyTriggersRef = useRef({});
  const tier = useDeviceTier();
  const caseTier = CASE_TIERS[tier];
  const gap = KEY_GAP_TIERS[tier];

  const keyPan = useMemo(() => computeKeyPan(alphaRows, 15), [alphaRows]);

  const registerTrigger = useCallback((id, trigger) => {
    keyTriggersRef.current[id] = trigger;
    return () => { if (keyTriggersRef.current[id] === trigger) delete keyTriggersRef.current[id]; };
  }, []);

  const [activeKeyIds, setActiveKeyIds] = useState([]);
  const shiftHeld = activeKeyIds.indexOf("lshift") !== -1 || activeKeyIds.indexOf("rshift") !== -1;

  const activateKey = useCallback((id) => {
    setActiveKeyIds((prev) => (prev.indexOf(id) !== -1 ? prev : [...prev, id]));
  }, []);
  const deactivateKey = useCallback((id) => {
    setActiveKeyIds((prev) => (prev.indexOf(id) !== -1 ? prev.filter((k) => k !== id) : prev));
  }, []);

  const soundCategory = useCallback((id) => {
    const modifierIds = new Set(["esc","grave","tab","caps","enter","backspace","lshift","rshift","lctrl","lwin","lalt","ralt","rwin","fn"]);
    if (id === "space") return "spacebar";
    if (modifierIds.has(id)) return "modifier";
    return "normal";
  }, []);

  const handleActivate = useCallback((id) => {
    activateKey(id);
    playKeySound(soundKey, soundCategory(id), false, keyPan[id] || 0, volume);
    if (typingMode && onType) {
      const chars = KEY_CHAR_MAP[id];
      if (chars) onType(chars[shiftHeld ? 1 : 0]);
      else if (id === "backspace") onType("\b");
      else if (id === "enter") onType("\n");
      else if (id === "tab") onType("\t");
    }
  }, [activateKey, soundKey, soundCategory, keyPan, volume, typingMode, onType, shiftHeld]);

  useEffect(() => {
    const held = new Set();
    const isTypingTarget = (target) => {
      const el = target;
      if (!el) return false;
      const tag = el.tagName ? el.tagName.toLowerCase() : "";
      return tag === "input" || tag === "textarea" || el.isContentEditable;
    };
    const releaseKey = (id) => {
      if (!held.has(id)) return;
      held.delete(id);
      if (keyTriggersRef.current[id]) keyTriggersRef.current[id].release();
      deactivateKey(id);
    };
    const releaseAllHeld = () => { held.forEach((id) => { if (keyTriggersRef.current[id]) keyTriggersRef.current[id].release(); deactivateKey(id); }); held.clear(); };
    const reconcileModifiers = (event) => {
      if (typeof event.getModifierState !== "function") return;
      for (const fam of MODIFIER_FAMILIES) if (!event.getModifierState(fam.modifier)) for (const id of fam.ids) releaseKey(id);
    };
    const handleKeyDown = (event) => {
      reconcileModifiers(event);
      if (event.code === "AltLeft" || event.code === "AltRight") event.preventDefault();
      if (event.repeat) return;
      if (isTypingTarget(event.target) && !typingMode) return;
      const id = CODE_TO_KEY_ID[event.code];
      if (!id || held.has(id)) return;
      held.add(id);
      if (keyTriggersRef.current[id]) keyTriggersRef.current[id].press();
      handleActivate(id);
    };
    const handleKeyUp = (event) => {
      reconcileModifiers(event);
      const id = CODE_TO_KEY_ID[event.code];
      if (!id) return;
      releaseKey(id);
    };
    const handleVisibilityChange = () => { if (document.hidden) releaseAllHeld(); };
    window.addEventListener("keydown", handleKeyDown);
    window.addEventListener("keyup", handleKeyUp);
    window.addEventListener("blur", releaseAllHeld);
    document.addEventListener("visibilitychange", handleVisibilityChange);
    return () => {
      window.removeEventListener("keydown", handleKeyDown);
      window.removeEventListener("keyup", handleKeyUp);
      window.removeEventListener("blur", releaseAllHeld);
      document.removeEventListener("visibilitychange", handleVisibilityChange);
    };
  }, [deactivateKey, handleActivate, typingMode]);

  const renderRow = (row, i) => (
    <div key={i} className="flex" style={{ gap }}>
      {row.map((key) => (
        <Key key={key.id} config={key} rowIndex={i} tier={tier} theme={theme} registerTrigger={registerTrigger} onActivate={handleActivate} onDeactivate={deactivateKey} />
      ))}
    </div>
  );

  const renderMiniCluster = (cluster, keyPrefix) => (
    <div className="flex flex-col" style={{ gap, width: "100%" }}>
      {cluster.map((row, i) => (
        <div key={`${keyPrefix}-${i}`} className="flex" style={{ gap }}>

function MagnifyingDock({ items, active, onSelect, magnify = 1.32, lift = 8, spread = 2 }) {
  const containerRef = useRef(null);
  const glyphRefs = useRef([]);
  const rafRef = useRef(null);

  const applyDistances = useCallback((clientX) => {
    const container = containerRef.current;
    if (!container) return;
    glyphRefs.current.forEach((el) => {
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const center = rect.left + rect.width / 2;
      const dPx = clientX == null ? Infinity : Math.abs(clientX - center);
      const unit = 56; // approx spacing between dock items, in px
      const d = dPx / unit;
      const reach = Math.max(1, spread);
      const f = d <= reach ? Math.max(0, (1 + Math.cos((Math.PI * d) / reach)) / 2) : 0;
      const scale = 1 + (magnify - 1) * f;
      el.style.transform = `translateY(${(-lift * f).toFixed(2)}px) scale(${scale.toFixed(3)})`;
    });
  }, [magnify, lift, spread]);

  const handleMouseMove = useCallback((e) => {
    const x = e.clientX;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(() => applyDistances(x));
  }, [applyDistances]);

  const handleMouseLeave = useCallback(() => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    applyDistances(null);
  }, [applyDistances]);

  return (
    <div
      ref={containerRef}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
      className="flex items-center gap-1.5 rounded-full px-3 py-2 pointer-events-auto"
      style={{
        background: "rgba(255,255,255,0.55)",
        backdropFilter: "blur(16px) saturate(180%)",
        WebkitBackdropFilter: "blur(16px) saturate(180%)",
        border: "1px solid rgba(255,255,255,0.6)",
        boxShadow: "0 8px 24px rgba(30,20,10,0.14), inset 0 1px 0 rgba(255,255,255,0.7)",
      }}
    >
      {items.map((item, i) => (
        <button
          key={item.key}
          type="button"
          onClick={() => onSelect(item.key)}
          className="gdock-item relative flex flex-col items-center gap-0.5 px-3 py-1 rounded-full"
        >
          <span
            ref={(el) => (glyphRefs.current[i] = el)}
            className="gdock-glyph flex items-center justify-center"
            style={{ "--d": 99, color: active === item.key ? "#b5651d" : "#57534e" }}
          >
            <NavIcon name={item.icon} />
          </span>
          <span className={`text-[11px] font-medium whitespace-nowrap ${active === item.key ? "text-[#b5651d]" : "text-neutral-500"}`}>{item.label}</span>
          {active === item.key && <span className="gdock-dot absolute -bottom-0.5 w-1 h-1 rounded-full bg-[#b5651d]" />}
          <span className="gdock-tip">{item.label}</span>
        </button>
      ))}
    </div>
  );
}

function Header({ appMode, onModeChange }) {
  const navItems = [
    { key: "test", label: "Test", icon: "timer" },
    { key: "free", label: "Free Mode", icon: "keyboard" },
  ];
  const [revealed, setRevealed] = useState(false);
  const hoveringRef = useRef(false);
  const focusedRef = useRef(false);

  useEffect(() => {
    const onMove = (e) => {
      if (e.clientY < 64) setRevealed(true);
      else if (e.clientY > 130 && !hoveringRef.current && !focusedRef.current) setRevealed(false);
    };
    window.addEventListener("mousemove", onMove);
    // Briefly peek the dock on first load so people know it's there.
    setRevealed(true);
    const peekTimer = setTimeout(() => { if (!hoveringRef.current && !focusedRef.current) setRevealed(false); }, 1400);
    return () => { window.removeEventListener("mousemove", onMove); clearTimeout(peekTimer); };
  }, []);

  return (
    <div
      className="fixed inset-x-0 top-0 z-50 flex justify-center pt-3"
      style={{ pointerEvents: "none" }}
      onMouseEnter={() => { hoveringRef.current = true; setRevealed(true); }}
      onMouseLeave={() => { hoveringRef.current = false; }}
      onFocus={() => { focusedRef.current = true; setRevealed(true); }}
      onBlur={(e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) { focusedRef.current = false; }
      }}
    >
      <div
        style={{
          transform: revealed ? "translateY(0)" : "translateY(-140%)",
          opacity: revealed ? 1 : 0,
          transition: "transform 320ms cubic-bezier(0.22,0.8,0.2,1), opacity 260ms ease",
          pointerEvents: "auto",
        }}
      >
        <MagnifyingDock items={navItems} active={appMode} onSelect={onModeChange} magnify={1.32} lift={8} spread={2} />
      </div>
    </div>
  );
}

function cleanWord(w) {
  return w.toLowerCase().replace(/[^a-z0-9']/g, "");
}

function pickFunnyWords(count) {
  const words = [];
  const usedIdx = new Set();
  while (words.length < count) {
    let idx = Math.floor(Math.random() * FUNNY_PARAGRAPHS.length);
    if (usedIdx.size < FUNNY_PARAGRAPHS.length) {
      while (usedIdx.has(idx)) idx = Math.floor(Math.random() * FUNNY_PARAGRAPHS.length);
      usedIdx.add(idx);
    }
    words.push(...FUNNY_PARAGRAPHS[idx].split(" ").map(cleanWord).filter(Boolean));
  }
  return words.slice(0, count);
}

function formatClock(seconds) {
  const s = Math.max(0, Math.round(seconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${r.toString().padStart(2, "0")}`;
}

function LiveWpmChart({ samples }) {
  const w = 150, h = 46;
  const max = Math.max(40, ...samples, 1);
  const pts = samples.length > 1 ? samples.map((v, i) => {
    const x = (i / (samples.length - 1)) * w;
    const y = h - (v / max) * h;
    return `${x},${y}`;
  }).join(" ") : `0,${h} ${w},${h}`;
  return (
    <div className="flex flex-col gap-1">
      <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Live WPM</span>
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="overflow-visible">
        <polyline points={pts} fill="none" stroke="#c99a52" strokeWidth="1.5" />
        {samples.map((v, i) => {
          const x = samples.length > 1 ? (i / (samples.length - 1)) * w : 0;
          const y = h - (v / max) * h;
          return <circle key={i} cx={x} cy={y} r="2" fill="#c99a52" />;
        })}
      </svg>
    </div>
  );
}

const LINE_FONT_PX = 22;
const LINE_HEIGHT_PX = 36;
const VISIBLE_LINES = 4;
const PAGE_LINES = 2;

function measureMonoCharWidth(fontPx) {
  try {
    const canvas = measureMonoCharWidth._c || (measureMonoCharWidth._c = document.createElement("canvas"));
    const ctx = canvas.getContext("2d");
    ctx.font = `${fontPx}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    return ctx.measureText("M").width;
  } catch (e) { return fontPx * 0.6; }
}

function wrapTextToLines(text, charsPerLine) {
  const cpl = Math.max(6, charsPerLine);
  const lines = [];
  let lineStart = 0;
  let lastSpace = -1;
  for (let i = 0; i < text.length; i++) {
    if (text[i] === " ") lastSpace = i;
    if (i - lineStart >= cpl) {
      if (lastSpace > lineStart) {
        lines.push({ start: lineStart, end: lastSpace });
        lineStart = lastSpace + 1;
        lastSpace = -1;
      } else {
        lines.push({ start: lineStart, end: i });
        lineStart = i;
      }
    }
  }
  if (lineStart < text.length) lines.push({ start: lineStart, end: text.length });
  return lines;
}

function TypingArea({ text, typed, onNeedMoreWords }) {
  const containerRef = useRef(null);
  const [charsPerLine, setCharsPerLine] = useState(48);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const compute = () => {
      const w = el.clientWidth;
      const cw = measureMonoCharWidth(LINE_FONT_PX) || 12;
      setCharsPerLine(Math.max(6, Math.floor(w / cw) - 1));
    };
    compute();
    const ro = new ResizeObserver(compute);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const lines = useMemo(() => wrapTextToLines(text, charsPerLine), [text, charsPerLine]);

  const currentLineIndex = useMemo(() => {
    for (let i = 0; i < lines.length; i++) {
      if (typed.length <= lines[i].end) return i;
    }
    return Math.max(0, lines.length - 1);
  }, [lines, typed.length]);

  useEffect(() => {
    if (lines.length - currentLineIndex < VISIBLE_LINES + 6) onNeedMoreWords && onNeedMoreWords();
  }, [lines.length, currentLineIndex, onNeedMoreWords]);

  const pageIndex = Math.floor(currentLineIndex / PAGE_LINES);
  const firstVisibleLine = pageIndex * PAGE_LINES;
  const scrollOffsetPx = firstVisibleLine * LINE_HEIGHT_PX;

  return (
    <div ref={containerRef} className="relative overflow-hidden" style={{ height: LINE_HEIGHT_PX * VISIBLE_LINES }}>
      <div style={{ transform: `translateY(${-scrollOffsetPx}px)`, transition: "transform 380ms cubic-bezier(0.32,0.72,0.24,1)" }}>
        {lines.map((line, li) => {
          const isLastOfNextLine = lines[li + 1];
          return (
            <div key={li} className="font-mono select-none whitespace-pre" style={{ height: LINE_HEIGHT_PX, lineHeight: `${LINE_HEIGHT_PX}px`, fontSize: LINE_FONT_PX, letterSpacing: "0.01em" }}>
              {text.slice(line.start, line.end).split("").map((ch, ci) => {
                const globalIdx = line.start + ci;
                let cls = "text-neutral-300";
                if (globalIdx < typed.length) {
                  cls = typed[globalIdx] === ch ? "text-neutral-800" : "text-red-500 bg-red-50";
                } else if (globalIdx === typed.length) {
                  cls = "text-neutral-300 border-l-2 border-[#b5651d] animate-pulse";
                }
                return <span key={ci} className={cls}>{ch}</span>;
              })}
              {isLastOfNextLine && typed.length === line.end && (
                <span className="text-neutral-300 border-l-2 border-[#b5651d] animate-pulse">&nbsp;</span>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================== APP ============================== */


function ToggleOffOn({ label, value, onChange }) {
  return (
    <div className="flex flex-col gap-1.5 items-center">
      <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">{label}</span>
      <button
        onClick={() => onChange(!value)}
        className={`px-4 py-2 rounded-xl text-xs font-bold border transition-colors ${value ? "bg-[#332217] text-white border-[#332217]" : "bg-[#F1ECE3] text-neutral-500 border-neutral-200"}`}
      >
        {value ? "ON" : "OFF"}
      </button>
    </div>
  );
}

function MiniStat({ label, value, unit, accent }) {
  return (
    <div className="flex flex-col gap-0.5">
      <span className="text-[10px] font-semibold uppercase tracking-wide text-neutral-400">{label}</span>
      <span className="text-2xl font-bold tabular-nums" style={{ color: accent || "#2c2620" }}>
        {value}{unit && <span className="text-sm font-semibold text-neutral-400">{unit}</span>}
      </span>
    </div>
  );
}

function WpmOverTimeChart({ samples }) {
  const w = 280, h = 130;
  const max = Math.max(40, ...samples, 1);
  const pt = (i, v) => [samples.length > 1 ? (i / (samples.length - 1)) * w : 0, h - (v / max) * h * 0.85 - 8];
  const line = samples.length > 1 ? samples.map((v, i) => pt(i, v).join(",")).join(" ") : `0,${h} ${w},${h}`;
  const area = samples.length > 1 ? `0,${h} ${line} ${w},${h}` : "";
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      {area && <polygon points={area} fill="#e8c187" opacity="0.35" />}
      <polyline points={line} fill="none" stroke="#c99a52" strokeWidth="2" />
      {samples.map((v, i) => {
        const [x, y] = pt(i, v);
        const last = i === samples.length - 1;
        return <circle key={i} cx={x} cy={y} r={last ? 4 : 2.5} fill={last ? "#fff" : "#c99a52"} stroke="#c99a52" strokeWidth={last ? 2 : 0} />;
      })}
    </svg>
  );
}

function LastTestsChart({ tests }) {
  const max = Math.max(...tests.map((t) => t.wpm), 40, 1);
  const slots = [...Array(10)].map((_, i) => tests[tests.length - 10 + i]);
  return (
    <div className="flex items-end gap-1.5 h-16">
      {slots.map((t, i) => (
        <div key={i} className="w-4 rounded-t-sm bg-[#e6cfa3]" style={{ height: t ? `${Math.max(8, (t.wpm / max) * 100)}%` : "8%" }} />
      ))}
    </div>
  );
}

const SETTINGS_KEY = "vks_settings_v1";
function loadSetting(key, fallback) {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    if (!(key in parsed)) return fallback;
    if (key === "themeKey" && !THEMES[parsed[key]]) return fallback;
    if (key === "soundKey" && !SOUND_PROFILES[parsed[key]]) return fallback;
    if (key === "layout" && !LAYOUT_META[parsed[key]]) return fallback;
    return parsed[key];
  } catch (e) { return fallback; }
}
function saveSettings(obj) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(obj)); } catch (e) {}
}

function App() {
  const [appMode, setAppMode] = useState("test");
  const [layout, setLayout] = useState(() => loadSetting("layout", "60"));
  const [themeKey, setThemeKey] = useState(() => loadSetting("themeKey", "walnut"));
  const [soundKey, setSoundKey] = useState(() => loadSetting("soundKey", "soft"));
  const [lighting, setLighting] = useState(() => loadSetting("lighting", "off"));
  const [volume, setVolume] = useState(() => loadSetting("volume", 0.8));
  const [typingMode, setTypingMode] = useState(true);

  const [timeLimit, setTimeLimit] = useState(() => loadSetting("timeLimit", 60));

  useEffect(() => {
    saveSettings({ layout, themeKey, soundKey, lighting, volume, timeLimit });
  }, [layout, themeKey, soundKey, lighting, volume, timeLimit]);

  const [words, setWords] = useState(() => pickFunnyWords(80));
  const text = useMemo(() => words.join(" "), [words]);
  const [typed, setTyped] = useState("");
  const [status, setStatus] = useState("idle"); // idle | running | done
  const [elapsed, setElapsed] = useState(0);
  const [liveWpm, setLiveWpm] = useState([]);
  const startRef = useRef(null);
  const lastSampleRef = useRef(0);

  const [freeTyped, setFreeTyped] = useState("");
  const handleFreeType = useCallback((ch) => {
    setFreeTyped((prev) => {
      if (ch === "\b") return prev.slice(0, -1);
      if (ch === "\t") return prev;
      if (ch === "\n") return prev + "\n";
      return prev + ch;
    });
  }, []);

  const extendWords = useCallback(() => {
    setWords((prev) => [...prev, ...pickFunnyWords(40)]);
  }, []);

  const startTest = useCallback(() => {
    setWords(pickFunnyWords(80));
    setTyped("");
    setElapsed(0);
    setLiveWpm([]);
    setStatus("running");
    setTypingMode(true);
    startRef.current = performance.now();
    lastSampleRef.current = 0;
  }, []);

  const stopTest = useCallback(() => {
    setStatus("idle");
    setTyped("");
    setElapsed(0);
    setLiveWpm([]);
  }, []);

  const toggleTest = useCallback((e) => {
    if (e && e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
    if (status === "running") stopTest();
    else startTest();
  }, [status, startTest, stopTest]);

  const finishTest = useCallback(() => {
    setStatus((prev) => {
      if (prev !== "running") return prev;
      return "done";
    });
  }, []);

  const correctCount = useMemo(() => {
    let c = 0;
    for (let i = 0; i < typed.length; i++) if (typed[i] === text[i]) c++;
    return c;
  }, [typed, text]);
  const errorCount = typed.length - correctCount;
  const minutes = Math.max(elapsed / 60, 1 / 60);
  const wpm = status === "idle" ? 0 : Math.round((correctCount / 5) / minutes);
  const rawWpm = status === "idle" ? 0 : Math.round((typed.length / 5) / minutes);
  const accuracy = typed.length ? Math.round((correctCount / typed.length) * 100) : 100;

  const handleType = useCallback((ch) => {
    if (status === "done") return;
    if (status === "idle") {
      setStatus("running");
      startRef.current = performance.now();
      lastSampleRef.current = 0;
      setLiveWpm([]);
    }
    setTyped((prev) => {
      if (ch === "\b") return prev.slice(0, -1);
      if (ch === "\n" || ch === "\t") return prev;
      if (prev.length >= text.length) return prev;
      return prev + ch;
    });
  }, [status, text.length]);

  const correctCountRef = useRef(0);
  useEffect(() => { correctCountRef.current = correctCount; }, [correctCount]);

  useEffect(() => {
    if (status !== "running") return;
    const interval = setInterval(() => {
      const secs = (performance.now() - startRef.current) / 1000;
      setElapsed(secs);
      if (Math.floor(secs) > lastSampleRef.current) {
        lastSampleRef.current = Math.floor(secs);
        setLiveWpm((prev) => {
          const mins = Math.max(secs / 60, 1 / 60);
          const w = Math.round((correctCountRef.current / 5) / mins);
          return [...prev.slice(-11), w];
        });
      }
      if (secs >= timeLimit) finishTest();
    }, 200);
    return () => clearInterval(interval);
  }, [status, timeLimit, finishTest]);

  const progress = Math.min(1, elapsed / timeLimit);

  const consistency = useMemo(() => {
    if (liveWpm.length < 2) return 100;
    const mean = liveWpm.reduce((a, b) => a + b, 0) / liveWpm.length;
    if (mean === 0) return 100;
    const variance = liveWpm.reduce((a, b) => a + (b - mean) ** 2, 0) / liveWpm.length;
    const stddev = Math.sqrt(variance);
    return Math.max(0, Math.min(100, Math.round(100 - (stddev / mean) * 100)));
  }, [liveWpm]);

  useEffect(() => {
    const onKeyDown = (e) => {
      // Prevent the browser default (page scroll / re-clicking a focused button) for Space.
      if (e.code === "Space" || e.key === " ") { e.preventDefault(); return; }
      if (e.key === "Enter") { e.preventDefault(); toggleTest(); }
      else if (e.key === "Escape") { e.preventDefault(); stopTest(); }
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [toggleTest, stopTest]);

  useEffect(() => {
    if (appMode === "free" && status === "running") stopTest();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [appMode]);

  const studioPanel = (
    <div className="rounded-2xl bg-white border border-neutral-200 shadow-sm p-4 flex flex-col gap-3">
      <span className="font-serif text-sm font-semibold text-neutral-800 tracking-wide">Keyboard Studio</span>
      <div className="flex flex-col gap-1.5">
        <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Layout</span>
        <div className="flex gap-1.5 flex-wrap">
          {Object.entries(LAYOUT_META).map(([key, m]) => (
            <SegButton key={key} active={layout === key} onClick={() => setLayout(key)}>{m.label}</SegButton>
          ))}
        </div>
      </div>
      <div className="flex flex-col gap-1.5">
        <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Finish</span>
        <div className="flex gap-1.5 flex-wrap">
          {Object.entries(THEMES).map(([key, t]) => (
            <SegButton key={key} active={themeKey === key} onClick={() => setThemeKey(key)}>{t.label}</SegButton>
          ))}
        </div>
      </div>
      <div className="flex flex-col gap-1.5">
        <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Sound Profile</span>
        <div className="flex gap-1.5 flex-wrap">
          {Object.entries(SOUND_PROFILES).map(([key, s]) => (
            <SegButton key={key} active={soundKey === key} onClick={() => setSoundKey(key)}>{s.label}</SegButton>
          ))}
        </div>
      </div>
      <div className="flex items-center justify-between gap-2">
        <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Lighting</span>
        <button
          type="button"
          onClick={() => setLighting((l) => (l === "off" ? "rgb" : "off"))}
          className={`relative w-11 h-6 rounded-full transition-colors ${lighting === "rgb" ? "bg-[#332217]" : "bg-neutral-200"}`}
          aria-pressed={lighting === "rgb"}
        >
          <span className={`absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform ${lighting === "rgb" ? "translate-x-5" : "translate-x-0"}`} />
        </button>
      </div>
    </div>
  );

  const volumePanel = (
    <div className="rounded-2xl bg-white border border-neutral-200 shadow-sm p-4 flex flex-col gap-2">
      <div className="flex items-center justify-between">
        <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Volume</span>
        <button
          type="button"
          onClick={() => playKeySound(soundKey, "normal", false, 0, volume)}
          className="text-[11px] font-medium text-[#b5651d] hover:text-[#8f4e17]"
        >
          Test Sound
        </button>
      </div>
      <div className="flex items-center gap-3">
        <SpeakerIcon muted={volume === 0} />
        <input type="range" min="0" max="1" step="0.05" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="flex-1 accent-[#332217]" />
      </div>
      <label className="flex items-center gap-1.5 text-xs font-medium text-neutral-600 cursor-pointer select-none whitespace-nowrap">
        <input type="checkbox" checked={typingMode} onChange={(e) => setTypingMode(e.target.checked)} className="accent-[#332217] w-4 h-4" />
        Typing mode
      </label>
    </div>
  );

  return (
    <div className="kb-viewport w-full h-screen overflow-hidden flex flex-col bg-[#FAF8F4]">
      <Header appMode={appMode} onModeChange={setAppMode} />

      {appMode === "free" ? (
        <div className="w-full flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-[1fr_290px] gap-3" style={{ maxWidth: "96rem", margin: "0 auto", padding: "0.65rem clamp(0.75rem, 2vw, 1.25rem)" }}>
          <div className="flex flex-col gap-3 min-w-0 min-h-0">
            <div className="w-full rounded-2xl bg-white border border-neutral-200 shadow-sm p-4 flex flex-col gap-2">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Free Mode — type anything, unlimited</span>
                <button onClick={() => setFreeTyped("")} className="text-[11px] font-medium text-neutral-400 hover:text-neutral-700">Clear</button>
              </div>
              <div className="rounded-xl bg-[#FCFBF8] border border-neutral-100 p-4 h-24 overflow-y-auto font-mono text-base text-neutral-700 whitespace-pre-wrap break-words">
                {freeTyped || <span className="text-neutral-300">Start typing on your keyboard…</span>}
              </div>
            </div>
            <div className="w-full flex-1 min-h-0 flex items-center justify-center">
              <div className="w-full" style={{ maxWidth: "54rem" }}>
                <VintageKeyboard
                  layout={layout}
                  themeKey={themeKey}
                  soundKey={soundKey}
                  volume={volume}
                  typingMode={true}
                  onType={handleFreeType}
                  lighting={lighting}
                />
              </div>
            </div>
          </div>
          <div className="flex flex-col gap-3 min-w-0 min-h-0 overflow-y-auto">
            {volumePanel}
            {studioPanel}
          </div>
        </div>
      ) : (
      <div className="w-full flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-[1fr_290px] gap-3" style={{ maxWidth: "96rem", margin: "0 auto", padding: "0.65rem clamp(0.75rem, 2vw, 1.25rem)" }}>

        {/* ================= MAIN COLUMN ================= */}
        <div className="flex flex-col gap-3 min-w-0 min-h-0">

          {/* Settings row */}
          <div className="w-full rounded-2xl bg-white border border-neutral-200 shadow-sm px-4 py-3 flex flex-wrap items-end gap-3">
            <Dropdown icon={<ClockIcon />} label="Time" value={timeLimit} onChange={(v) => setTimeLimit(Number(v))}
              options={TIME_OPTIONS.map((t) => ({ value: t, label: `${t} Seconds` }))} />
            <div className="flex flex-col items-end gap-1 ml-auto">
              <button type="button" onClick={toggleTest} className={`flex items-center gap-2 font-semibold px-5 py-2.5 rounded-xl text-sm shadow-sm transition-colors ${status === "running" ? "bg-[#a33a2e] hover:bg-[#8c3026] text-white" : "bg-[#332217] hover:bg-[#241a11] text-white"}`}>
                {status === "running" ? "Stop Test" : "Start Test"}
              </button>
              <span className="text-[11px] text-neutral-400">Press Enter to {status === "running" ? "stop" : "start"}</span>
            </div>
          </div>

          {/* Text card */}
          <div className="relative w-full rounded-2xl bg-white border border-neutral-200 shadow-sm p-4 sm:p-5 flex flex-col gap-3">
            <div className="rounded-xl bg-[#FCFBF8] border border-neutral-100 p-4 overflow-hidden">
              <TypingArea text={text} typed={typed} onNeedMoreWords={extendWords} />
            </div>
            <div className="flex items-center gap-3">
              <span className="text-xs text-neutral-400 tabular-nums w-10">{formatClock(elapsed)}</span>
              <div className="flex-1 h-1.5 rounded-full bg-neutral-100 overflow-hidden">
                <div className="h-full bg-[#c99a52] transition-all" style={{ width: `${progress * 100}%` }} />
              </div>
              <span className="text-xs text-neutral-400 tabular-nums w-10 text-right">{formatClock(timeLimit)}</span>
            </div>

            {status === "done" && (
              <div className="absolute inset-0 rounded-2xl bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center gap-4 p-4 z-10">
                <span className="font-serif text-lg font-semibold text-neutral-800">Test Complete!</span>
                <div className="flex flex-wrap items-center justify-center gap-6">
                  <MiniStat label="WPM" value={wpm} />
                  <MiniStat label="Accuracy" value={accuracy} unit="%" />
                  <MiniStat label="Raw WPM" value={rawWpm} />
                  <MiniStat label="Errors" value={errorCount} accent="#c23b3b" />
                  <MiniStat label="Consistency" value={consistency} unit="%" />
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={startTest} className="flex items-center gap-2 bg-[#332217] hover:bg-[#241a11] text-white font-semibold px-5 py-2 rounded-xl text-sm shadow-sm transition-colors">
                    ↻ Try Again
                  </button>
                  <button onClick={stopTest} className="text-sm font-medium text-neutral-400 hover:text-neutral-700 px-3 py-2">Dismiss</button>
                </div>
              </div>
            )}
          </div>

          {/* Keyboard */}
          <div className="w-full flex-1 min-h-0 flex items-center justify-center">
            <div className="w-full" style={{ maxWidth: "54rem" }}>
              <VintageKeyboard
                layout={layout}
                themeKey={themeKey}
                soundKey={soundKey}
                volume={volume}
                typingMode={typingMode}
                onType={handleType}
                lighting={lighting}
              />
            </div>
          </div>
        </div>

        {/* ================= SIDEBAR ================= */}
        <div className="flex flex-col gap-3 min-w-0 min-h-0 overflow-y-auto">
          <div className="rounded-2xl bg-white border border-neutral-200 shadow-sm p-4 flex flex-col gap-3">
            <div className="flex items-center justify-between">
              <span className="font-serif text-sm font-semibold text-neutral-800">Live Stats</span>
              <span className="flex items-center gap-1 text-[11px] font-semibold text-emerald-600">
                <span className={`w-1.5 h-1.5 rounded-full ${status === "running" ? "bg-emerald-500" : "bg-neutral-300"}`} /> {status === "running" ? "TYPING" : "IDLE"}
              </span>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <MiniStat label="WPM" value={wpm} />
              <MiniStat label="Accuracy" value={accuracy} unit="%" />
              <MiniStat label="Raw WPM" value={rawWpm} />
              <MiniStat label="Errors" value={errorCount} accent="#c23b3b" />
              <MiniStat label="Consistency" value={consistency} unit="%" />
            </div>
            <div>
              <span className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">WPM Over Time</span>
              <WpmOverTimeChart samples={liveWpm} />
            </div>
          </div>

          {volumePanel}
          {studioPanel}
        </div>
      </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
